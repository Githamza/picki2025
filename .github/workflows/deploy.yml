name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  KEEP_RELEASES: 5

jobs:
  # ─── Generate version string ───────────────────────────────────────────
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Build Angular app once ────────────────────────────────────────────
  build:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: dist/my-angular-app/browser/
          retention-days: 30

  # ─── Deploy to Server 1 ───────────────────────────────────────────────
  deploy-server-1:
    name: Deploy to Server 1
    runs-on: ubuntu-latest
    needs: [version, build]
    environment: production-server-1
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_1 }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT_1 }} -H ${{ secrets.SSH_HOST_1 }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy release
        env:
          SSH_USER: ${{ secrets.SSH_USER_1 }}
          SSH_HOST: ${{ secrets.SSH_HOST_1 }}
          SSH_PORT: ${{ secrets.SSH_PORT_1 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_1 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"
          RELEASE_DIR="$DEPLOY_PATH/releases/$VERSION"

          # Create release directory
          $SSH_CMD "$REMOTE" "mkdir -p $RELEASE_DIR"

          # Upload build files
          rsync -azq --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            build-output/ \
            "$REMOTE:$RELEASE_DIR/"

          # Build manifest JSON on runner side
          DEPLOY_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST="{\"version\":\"$VERSION\",\"deployed_at\":\"$DEPLOY_TS\",\"sha\":\"$GITHUB_SHA\"}"

          # Switch symlink and finalize on remote
          $SSH_CMD "$REMOTE" bash -s <<SWITCH
            set -e
            cd "$DEPLOY_PATH"

            # Ensure .htaccess exists at deploy root
            if [ -f "releases/$VERSION/.htaccess" ]; then
              cp "releases/$VERSION/.htaccess" .htaccess
            fi

            # Atomic symlink switch
            ln -sfn "releases/$VERSION" current_new
            if mv -T current_new current 2>/dev/null; then
              true
            else
              rm -f current
              mv current_new current
            fi

            # Write deploy manifest
            echo '$MANIFEST' > deploy-manifest.json

            # Prune old releases (keep ${{ env.KEEP_RELEASES }} most recent)
            cd releases
            ls -1dt */ | tail -n +$(( ${{ env.KEEP_RELEASES }} + 1 )) | xargs -I{} rm -rf "{}" 2>/dev/null || true
          SWITCH

          echo "### Server 1 deployed: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Deploy to Server 2 ───────────────────────────────────────────────
  deploy-server-2:
    name: Deploy to Server 2
    runs-on: ubuntu-latest
    needs: [version, build]
    environment: production-server-2
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_2 }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT_2 }} -H ${{ secrets.SSH_HOST_2 }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy release
        env:
          SSH_USER: ${{ secrets.SSH_USER_2 }}
          SSH_HOST: ${{ secrets.SSH_HOST_2 }}
          SSH_PORT: ${{ secrets.SSH_PORT_2 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_2 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"
          RELEASE_DIR="$DEPLOY_PATH/releases/$VERSION"

          # Create release directory
          $SSH_CMD "$REMOTE" "mkdir -p $RELEASE_DIR"

          # Upload build files
          rsync -azq --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            build-output/ \
            "$REMOTE:$RELEASE_DIR/"

          # Build manifest JSON on runner side
          DEPLOY_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST="{\"version\":\"$VERSION\",\"deployed_at\":\"$DEPLOY_TS\",\"sha\":\"$GITHUB_SHA\"}"

          # Switch symlink and finalize on remote
          $SSH_CMD "$REMOTE" bash -s <<SWITCH
            set -e
            cd "$DEPLOY_PATH"

            # Ensure .htaccess exists at deploy root
            if [ -f "releases/$VERSION/.htaccess" ]; then
              cp "releases/$VERSION/.htaccess" .htaccess
            fi

            # Atomic symlink switch
            ln -sfn "releases/$VERSION" current_new
            if mv -T current_new current 2>/dev/null; then
              true
            else
              rm -f current
              mv current_new current
            fi

            # Write deploy manifest
            echo '$MANIFEST' > deploy-manifest.json

            # Prune old releases (keep ${{ env.KEEP_RELEASES }} most recent)
            cd releases
            ls -1dt */ | tail -n +$(( ${{ env.KEEP_RELEASES }} + 1 )) | xargs -I{} rm -rf "{}" 2>/dev/null || true
          SWITCH

          echo "### Server 2 deployed: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Run database migrations ───────────────────────────────────────────
  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: echo "### Database migrations applied" >> "$GITHUB_STEP_SUMMARY"

  # ─── Deploy Supabase Edge Functions (after migrations) ─────────────────
  deploy-supabase-functions:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: [version, migrate-database]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: echo "### Supabase functions deployed" >> "$GITHUB_STEP_SUMMARY"

  # ─── Tag release after all deployments succeed ─────────────────────────
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs:
      - version
      - deploy-server-1
      - deploy-server-2
      - migrate-database
      - deploy-supabase-functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy/$VERSION" -m "Deploy $VERSION"
          git push origin "deploy/$VERSION"

      - name: Summary
        run: echo "### Tagged: \`deploy/${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
