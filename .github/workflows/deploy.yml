name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Generate version string ───────────────────────────────────────────
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Build Angular app once ────────────────────────────────────────────
  build:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: dist/my-angular-app/browser/
          retention-days: 30

  # ─── Deploy to Server 1 via FTP ────────────────────────────────────────
  deploy-server-1:
    name: Deploy to Server 1
    runs-on: ubuntu-latest
    needs: [version, build]
    environment: production-server-1
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST_1 }}
          FTP_USER: ${{ secrets.FTP_USER_1 }}
          FTP_PASS: ${{ secrets.FTP_PASS_1 }}
          FTP_PATH: ${{ secrets.FTP_PATH_1 }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            mirror --reverse --delete --verbose --parallel=10 \
              build-output/ $FTP_PATH/;
            quit
          "
          echo "### Server 1 deployed: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Deploy to Server 2 via FTP ────────────────────────────────────────
  deploy-server-2:
    name: Deploy to Server 2
    runs-on: ubuntu-latest
    needs: [version, build]
    environment: production-server-2
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST_2 }}
          FTP_USER: ${{ secrets.FTP_USER_2 }}
          FTP_PASS: ${{ secrets.FTP_PASS_2 }}
          FTP_PATH: ${{ secrets.FTP_PATH_2 }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            mirror --reverse --delete --verbose --parallel=10 \
              build-output/ $FTP_PATH/;
            quit
          "
          echo "### Server 2 deployed: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Run database migrations ───────────────────────────────────────────
  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: echo "### Database migrations applied" >> "$GITHUB_STEP_SUMMARY"

  # ─── Deploy Supabase Edge Functions (after migrations) ─────────────────
  deploy-supabase-functions:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: [version, migrate-database]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: echo "### Supabase functions deployed" >> "$GITHUB_STEP_SUMMARY"

  # ─── Tag release after all deployments succeed ─────────────────────────
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs:
      - version
      - deploy-server-1
      - deploy-server-2
      - migrate-database
      - deploy-supabase-functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy/$VERSION" -m "Deploy $VERSION"
          git push origin "deploy/$VERSION"

      - name: Summary
        run: 'echo "### Tagged: `deploy/${{ needs.version.outputs.version }}`" >> "$GITHUB_STEP_SUMMARY"'
