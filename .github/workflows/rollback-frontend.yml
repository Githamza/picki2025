name: Rollback Frontend

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Which server to roll back'
        required: true
        type: choice
        options:
          - both
          - server-1
          - server-2
      version:
        description: 'Deploy version to roll back to (e.g. 2026.01.26-ec4e199)'
        required: true
        type: string

jobs:
  # ─── Rollback Server 1 ─────────────────────────────────────────────────
  rollback-server-1:
    name: Rollback Server 1
    runs-on: ubuntu-latest
    if: inputs.server == 'server-1' || inputs.server == 'both'
    steps:
      - name: Checkout code at deploy tag
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: npm ci && npm run build

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST_1 }}
          FTP_USER: ${{ secrets.FTP_USER_1 }}
          FTP_PASS: ${{ secrets.FTP_PASS_1 }}
          FTP_PATH: ${{ secrets.FTP_PATH_1 }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            mirror --reverse --delete --verbose --parallel=10 \
              dist/my-angular-app/browser/ $FTP_PATH/;
            quit
          "
          echo "### Server 1 rolled back to \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Rollback Server 2 ─────────────────────────────────────────────────
  rollback-server-2:
    name: Rollback Server 2
    runs-on: ubuntu-latest
    if: inputs.server == 'server-2' || inputs.server == 'both'
    steps:
      - name: Checkout code at deploy tag
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: npm ci && npm run build

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST_2 }}
          FTP_USER: ${{ secrets.FTP_USER_2 }}
          FTP_PASS: ${{ secrets.FTP_PASS_2 }}
          FTP_PATH: ${{ secrets.FTP_PATH_2 }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            mirror --reverse --delete --verbose --parallel=10 \
              dist/my-angular-app/browser/ $FTP_PATH/;
            quit
          "
          echo "### Server 2 rolled back to \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
