name: Rollback Frontend

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Which server to roll back'
        required: true
        type: choice
        options:
          - both
          - server-1
          - server-2
      version:
        description: 'Target version (e.g. 2026.01.26-ec4e199). Leave empty for previous release.'
        required: false
        type: string
      action:
        description: 'Rollback method'
        required: true
        type: choice
        options:
          - switch-symlink
          - rebuild-deploy

jobs:
  # ─── Resolve target version ────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version is required. SSH into the server and run: ls releases/ to find available versions."
            exit 1
          fi

  # ─── Rollback Server 1 ─────────────────────────────────────────────────
  rollback-server-1:
    name: Rollback Server 1
    runs-on: ubuntu-latest
    needs: resolve-version
    if: inputs.server == 'server-1' || inputs.server == 'both'
    steps:
      - name: Checkout code (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ needs.resolve-version.outputs.version }}

      - name: Setup Node.js (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        run: npm ci && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_1 }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT_1 }} -H ${{ secrets.SSH_HOST_1 }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload rebuilt release
        if: inputs.action == 'rebuild-deploy'
        env:
          SSH_USER: ${{ secrets.SSH_USER_1 }}
          SSH_HOST: ${{ secrets.SSH_HOST_1 }}
          SSH_PORT: ${{ secrets.SSH_PORT_1 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_1 }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"
          RELEASE_DIR="$DEPLOY_PATH/releases/$VERSION"

          $SSH_CMD "$REMOTE" "mkdir -p $RELEASE_DIR"

          rsync -azq --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/my-angular-app/browser/ \
            "$REMOTE:$RELEASE_DIR/"

      - name: Switch symlink on Server 1
        env:
          SSH_USER: ${{ secrets.SSH_USER_1 }}
          SSH_HOST: ${{ secrets.SSH_HOST_1 }}
          SSH_PORT: ${{ secrets.SSH_PORT_1 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_1 }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"

          ROLLBACK_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST="{\"version\":\"$VERSION\",\"rolled_back_at\":\"$ROLLBACK_TS\",\"action\":\"rollback\"}"

          $SSH_CMD "$REMOTE" bash -s <<ROLLBACK
            set -e
            cd "$DEPLOY_PATH"

            if [ ! -d "releases/$VERSION" ]; then
              echo "ERROR: Release $VERSION not found in releases/"
              ls -1 releases/
              exit 1
            fi

            ln -sfn "releases/$VERSION" current_new
            if mv -T current_new current 2>/dev/null; then
              true
            else
              rm -f current
              mv current_new current
            fi

            echo '$MANIFEST' > deploy-manifest.json
            echo "Rolled back to $VERSION"
          ROLLBACK

          echo "### Server 1 rolled back to \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Rollback Server 2 ─────────────────────────────────────────────────
  rollback-server-2:
    name: Rollback Server 2
    runs-on: ubuntu-latest
    needs: resolve-version
    if: inputs.server == 'server-2' || inputs.server == 'both'
    steps:
      - name: Checkout code (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ needs.resolve-version.outputs.version }}

      - name: Setup Node.js (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (for rebuild only)
        if: inputs.action == 'rebuild-deploy'
        run: npm ci && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_2 }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT_2 }} -H ${{ secrets.SSH_HOST_2 }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload rebuilt release
        if: inputs.action == 'rebuild-deploy'
        env:
          SSH_USER: ${{ secrets.SSH_USER_2 }}
          SSH_HOST: ${{ secrets.SSH_HOST_2 }}
          SSH_PORT: ${{ secrets.SSH_PORT_2 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_2 }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"
          RELEASE_DIR="$DEPLOY_PATH/releases/$VERSION"

          $SSH_CMD "$REMOTE" "mkdir -p $RELEASE_DIR"

          rsync -azq --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/my-angular-app/browser/ \
            "$REMOTE:$RELEASE_DIR/"

      - name: Switch symlink on Server 2
        env:
          SSH_USER: ${{ secrets.SSH_USER_2 }}
          SSH_HOST: ${{ secrets.SSH_HOST_2 }}
          SSH_PORT: ${{ secrets.SSH_PORT_2 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_2 }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          REMOTE="$SSH_USER@$SSH_HOST"

          ROLLBACK_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST="{\"version\":\"$VERSION\",\"rolled_back_at\":\"$ROLLBACK_TS\",\"action\":\"rollback\"}"

          $SSH_CMD "$REMOTE" bash -s <<ROLLBACK
            set -e
            cd "$DEPLOY_PATH"

            if [ ! -d "releases/$VERSION" ]; then
              echo "ERROR: Release $VERSION not found in releases/"
              ls -1 releases/
              exit 1
            fi

            ln -sfn "releases/$VERSION" current_new
            if mv -T current_new current 2>/dev/null; then
              true
            else
              rm -f current
              mv current_new current
            fi

            echo '$MANIFEST' > deploy-manifest.json
            echo "Rolled back to $VERSION"
          ROLLBACK

          echo "### Server 2 rolled back to \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
