server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build artifacts are immutable; index.html stays uncached so a new
  # deploy is picked up on the next reload.
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
