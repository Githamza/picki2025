<div class="category-grid-container">
  @if (error$ | async; as error) {
    <div class="error-container">
      <p>{{ error }}</p>
    </div>
  }

  @if (loading$ | async) {
    <div class="categories-loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <div class="category-grid" [style.--columns]="columns()">
      @for (category of (categories$ | async) || []; track category.id) {
        <mat-card
          class="category-card"
          appearance="outlined"
          (click)="selectCategory(category)"
        >
          <div class="category-image-container">
            <img
              [appCachedImage]="category.imageUrl || placeholderImage"
              [fallbackSrc]="placeholderImage"
              [alt]="category.name + ' category'"
              class="category-image"
            />
          </div>
          <mat-card-content>
            <h3 class="category-name storefront-card-title">{{ category.name }}</h3>
            @if (category.description) {
              <p class="category-description storefront-body">
                {{ category.description }}
              </p>
            }
          </mat-card-content>
        </mat-card>
      } @empty {
        <div class="no-categories">
          <p>Aucune catégorie disponible.</p>
        </div>
      }
    </div>
  }
</div>
