<div class="category-grid-container">
  <div *ngIf="error$ | async as error" class="error-container">
    <p>{{ error }}</p>
  </div>

  <div *ngIf="loading$ | async" class="categories-loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="category-grid" *ngIf="!(loading$ | async)">
    <mat-card
      *ngFor="let category of categories$ | async"
      class="category-card"
      appearance="outlined"
      (click)="selectCategory(category)"
    >
      <div class="category-image-container">
        <img
          [appCachedImage]="category.imageUrl || placeholderImage"
          [fallbackSrc]="placeholderImage"
          [alt]="category.name + ' category'"
          class="category-image"
        />
      </div>
      <mat-card-content>
        <h3 class="category-name">{{ category.name }}</h3>
        <p class="category-description" *ngIf="category.description">
          {{ category.description }}
        </p>
      </mat-card-content>
    </mat-card>
  </div>

  <div
    *ngIf="(categories$ | async)?.length === 0 && !(loading$ | async)"
    class="no-categories"
  >
    <p>Aucune catégorie disponible.</p>
  </div>
</div>
