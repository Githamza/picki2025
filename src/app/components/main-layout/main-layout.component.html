<!-- Main Layout without overlay -->
<div class="layout-container">
  <mat-toolbar color="primary" class="toolbar mat-elevation-z2">
    <span class="toolbar-spacer"></span>

    <!-- Show dining preference indicator when selected -->
    <button
      *ngIf="diningPreferenceService.hasSelectedPreference()"
      class="dining-preference-indicator"
      mat-button
      (click)="changeDiningPreference()"
      aria-label="Changer la préférence de restauration"
    >
      <mat-icon class="preference-icon">
        {{
          diningPreferenceService.diningPreference() === "eat-in"
            ? "restaurant"
            : "takeout_dining"
        }}
      </mat-icon>
      <span class="preference-text">{{
        diningPreferenceService.getDiningPreferenceText()
      }}</span>
      <mat-icon class="change-icon" iconPositionEnd>edit</mat-icon>
    </button>

    <button
      mat-icon-button
      (click)="toggleTheme()"
      aria-label="Basculer le thème"
    >
      <mat-icon class="material-symbols-rounded">{{
        isDarkTheme ? "light_mode" : "dark_mode"
      }}</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="menuOpened && !(isHandset$ | async)"
      class="sidenav mat-elevation-z1"
      [class.mat-rounded-medium]="!(isHandset$ | async)"
    >
      <app-category-menu></app-category-menu>
    </mat-sidenav>

    <mat-sidenav-content class="content-area">
      <div class="main-content mat-rounded-medium">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
  <app-cart-badge></app-cart-badge>
</div>
