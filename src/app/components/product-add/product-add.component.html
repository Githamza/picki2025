<div class="product-add-wrapper">
  <div class="close-btn-wrapper">
    <button
      mat-icon-button
      class="close-btn"
      aria-label="Fermer"
      (click)="closePage()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div *ngIf="product$ | async as product; else productNotFound">
    <!-- Regular Product View (non-multi-step products) -->
    <app-regular-product-view
      *ngIf="!product.isMultiStep"
      [product]="product"
      [quantity]="quantity"
      [isSingleStepProduct]="false"
      (quantityIncrement)="incrementQuantity()"
      (quantityDecrement)="decrementQuantity()"
      (removeItem)="removeItem()"
      (addToCart)="addToCart($event)"
    ></app-regular-product-view>

    <!-- Multi-Step Product Configuration -->
    <div *ngIf="product.isMultiStep">
      <!-- Single-Step Product Configuration -->
      <app-regular-product-view
        *ngIf="(isSingleStepProduct$ | async) === true"
        [product]="product"
        [quantity]="quantity"
        [isSingleStepProduct]="true"
        (quantityIncrement)="incrementQuantity()"
        (quantityDecrement)="decrementQuantity()"
        (removeItem)="removeItem()"
        (addToCart)="addToCart($event)"
      ></app-regular-product-view>

      <!-- Multi-Step Product Configuration (multiple steps) -->
      <app-add-product-multi-step
        *ngIf="(isSingleStepProduct$ | async) === false"
        [productId]="product.id"
        class="multi-step-wrapper"
      >
      </app-add-product-multi-step>

      <!-- Loading state only when observable hasn't emitted yet -->
      <div
        *ngIf="
          (isSingleStepProduct$ | async) === null ||
          (isSingleStepProduct$ | async) === undefined
        "
        class="loading-state"
      >
        <p>Loading product configuration...</p>
      </div>
    </div>
  </div>

  <ng-template #productNotFound>
    <div class="product-not-found">
      <h2>Product not found</h2>
      <p>Sorry, we couldn't find the product you're looking for.</p>
    </div>
  </ng-template>

  <ng-template #loadingState>
    <div class="loading-state">
      <p>Loading product configuration...</p>
    </div>
  </ng-template>
</div>
