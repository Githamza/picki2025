<div class="product-add-wrapper">
  <div class="close-btn-wrapper">
    <button
      mat-icon-button
      class="close-btn"
      aria-label="Fermer"
      (click)="closePage()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div *ngIf="product$ | async as product; else loadingOrNotFound">
    <!-- Regular Product View (for all non-multi-step products) -->
    <app-regular-product-view
      *ngIf="!product.isMultiStep"
      [product]="product"
      [quantity]="quantity"
      [cartQuantityForProduct]="cartQuantityForProduct"
      (quantityIncrement)="incrementQuantity()"
      (quantityDecrement)="decrementQuantity()"
      (removeItem)="removeItem()"
      (addToCart)="addToCart($event)"
    ></app-regular-product-view>

    <!-- Multi-Step Product Configuration (multiple steps only) -->
    <app-add-product-multi-step
      *ngIf="product.isMultiStep"
      [productId]="product.id"
      class="multi-step-wrapper"
    ></app-add-product-multi-step>
  </div>

  <ng-template #loadingOrNotFound>
    <div *ngIf="productsLoading$ | async; else productNotFound" class="product-loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
    <ng-template #productNotFound>
      <div class="product-not-found">
        <h2>Product not found</h2>
        <p>Sorry, we couldn't find the product you're looking for.</p>
      </div>
    </ng-template>
  </ng-template>
</div>
