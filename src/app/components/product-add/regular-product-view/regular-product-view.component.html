<div class="product-add-container">
  <div class="product-content">
    <div class="flex">
      <div class="product-image-container">
        <img
          [src]="product.imageUrl || placeholderImage"
          [alt]="product.name"
          title="Product image"
          class="product-image"
          appViewTransitionName="product-hero"
        />
      </div>

      <div class="product-details">
        <div class="product-header">
          <h1>{{ product.name }}</h1>
        </div>
        <div
          class="product-price"
          [style.visibility]="product.price > 0 ? 'visible' : 'hidden'"
        >
          {{ product.price | vendorCurrency }}
        </div>

        <div class="product-description-container">
          <p class="product-short-description" *ngIf="product.shortDescription">
            {{ product.shortDescription }}
          </p>
          <p class="product-long-description" *ngIf="product.longDescription">
            {{ product.longDescription }}
          </p>
          <!-- Fallback to old description field if new fields aren't available -->
          <p
            class="product-description"
            *ngIf="!product.longDescription && product.description"
          >
            {{ product.description }}
          </p>
        </div>
      </div>
    </div>

  </div>

  <!-- Upsell strip: drinks/desserts pool (hidden entirely when empty) -->
  <div class="upsell-section" *ngIf="upsellSuggestions().length > 0">
    <app-accessories-strip
      stripTitle="Pour accompagner"
      [accessories]="upsellSuggestions()"
      [cartAccessories]="cartItemsForStrip()"
      (add)="onUpsellAdd($event)"
      (increment)="onUpsellIncrement($event)"
      (decrement)="onUpsellDecrement($event)"
      (remove)="onUpsellRemove($event)"
    ></app-accessories-strip>
  </div>

  <!-- Comment Section (collapsed behind a toggle) -->
  <div class="comment-section">
    <button
      *ngIf="!commentOpen()"
      mat-button
      class="comment-toggle"
      (click)="commentOpen.set(true)"
    >
      <mat-icon>add</mat-icon>
      Ajouter un commentaire
    </button>
    <mat-form-field class="comment-field" *ngIf="commentOpen()">
      <mat-label>Commentaires (optionnel)</mat-label>
      <textarea
        matInput
        [ngModel]="comment()"
        (ngModelChange)="comment.set($event)"
        placeholder="Ex: Sans oignons, bien cuit, sauce à part..."
        rows="3"
        maxlength="500"
      >
      </textarea>
      <mat-hint>Précisez vos préférences pour ce produit</mat-hint>
    </mat-form-field>
  </div>
  <app-add-to-cart-bar
    [quantity]="quantity"
    [totalPrice]="totalPrice * quantity"
    [buttonText]="product.hasCustomisations && productCustomisations.length > 0 ? 'Personnaliser et ajouter' : 'Ajouter'"
    [stockLimitReached]="isStockLimitReached()"
    [stockQuantity]="product.stockQuantity ?? null"
    [cartQuantityForProduct]="cartQuantityForProduct"
    (increment)="onIncrementQuantity()"
    (decrement)="onDecrementQuantity()"
    (remove)="onRemoveItem()"
    (addToCart)="onAddToCart()"
  ></app-add-to-cart-bar>
</div>
