<div class="product-grid-container">
  <div class="category-header" *ngIf="selectedCategory$ | async as category">
    <h2>{{ category.name }}</h2>
    <p *ngIf="category.description">{{ category.description }}</p>
  </div>

  <div class="no-category" *ngIf="!(selectedCategory$ | async)">
    <h2>Please select a category from the menu</h2>
  </div>

  <div class="product-grid" [attr.view-transition-name]="'product-grid'">
    <mat-card
      *ngFor="let product of filteredProducts$ | async"
      [attr.view-transition-name]="'product-card-' + product.id"
      class="product-card"
      appearance="outlined"
    >
      <img
        mat-card-image
        [src]="product.imageUrl"
        [alt]="product.name"
        alt=""
      />
      <mat-card-content>
        <h3>{{ product.name }}</h3>
        <p class="price">${{ product.price.toFixed(2) }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button
          mat-fab
          color="primary"
          class="add-to-order-fab"
          (click)="addToCart(product)"
          matTooltip="Add to order"
        >
          <mat-icon>add_shopping_cart</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="no-products" *ngIf="(filteredProducts$ | async)?.length === 0">
    <p>No products found in this category.</p>
  </div>
</div>
