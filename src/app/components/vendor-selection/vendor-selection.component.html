<div class="vendor-selection-container">
  <div class="vendor-selection-header">
    <h1>Select a Restaurant</h1>
    <p>Choose from our available restaurants:</p>
  </div>

  <div class="vendor-grid" *ngIf="vendors.length > 0">
    <mat-card
      class="vendor-card"
      *ngFor="let vendor of vendors"
      (click)="selectVendor(vendor)"
      [class.inactive]="!vendor.is_active"
    >
      <mat-card-header>
        <mat-card-title>{{ vendor.business_name }}</mat-card-title>
        <mat-card-subtitle *ngIf="vendor.business_type">
          {{ vendor.business_type }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="vendor-status">
          <mat-chip [color]="vendor.is_active ? 'primary' : 'warn'" selected>
            {{ vendor.is_active ? "Open" : "Closed" }}
          </mat-chip>
        </div>
      </mat-card-content>

      <mat-card-actions *ngIf="vendor.is_active">
        <button mat-raised-button color="primary">Enter Restaurant</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="no-vendors" *ngIf="vendors.length === 0">
    <mat-icon>store</mat-icon>
    <h2>No restaurants available</h2>
    <p>Please check back later.</p>
  </div>
</div>
